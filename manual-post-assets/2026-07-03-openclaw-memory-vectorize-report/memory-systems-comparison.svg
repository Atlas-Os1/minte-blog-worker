re</text><text x="1280" y="508" fill="#f8fafc" font-size="22">Platform-led</text><rect x="60" y="570" width="1480" height="94" rx="22" fill="#0f172a" stroke="#1e293b"/><rect x="78" y="588" width="200" height="58" rx="16" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b"/><text x="104" y="625" fill="#f8fafc" font-size="28" font-weight="700">Letta</text><text x="328" y="612" fill="#cbd5e1">Deploy model</text><text x="328" y="638" fill="#f8fafc" font-size="22">Stateful agent platform</text><text x="840" y="612" fill="#cbd5e1">Best fit</text><text x="840" y="638" fill="#f8fafc" font-size="22">CLI + API agents</text><text x="1280" y="612" fill="#cbd5e1">Posture</text><text x="1280" y="638" fill="#f8fafc" font-size="22">Platform/runtime</text><rect x="60" y="700" width="1480" height="94" rx="22" fill="#0f172a" stroke="#1e293b"/><rect x="78" y="718" width="200" height="58" rx="16" fill="#fb7185" fill-opacity="0.16" stroke="#fb7185"/><text x="104" y="755" fill="#f8fafc" font-size="28" font-weight="700">LangMem</text><text x="328" y="742" fill="#cbd5e1">Deploy model</text><text x="328" y="768" fill="#f8fafc" font-size="22">Library primitives + LangGraph store</text><text x="840" y="742" fill="#cbd5e1">Best fit</text><text x="840" y="768" fill="#f8fafc" font-size="22">Framework-native memory</text><text x="1280" y="742" fill="#cbd5e1">Posture</text><text x="1280" y="768" fill="#f8fafc" font-size="22">Library-first</text></g>
