<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Minte Blog R2 asset bundle smoke test</title>
  <desc id="desc">A simple three-bar chart showing that post assets can publish to R2 without redeploying the Worker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#16c7a8"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <text x="80" y="110" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800">R2 Blog Asset Bundles</text>
  <text x="80" y="158" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="26">Images, SVG charts, and interactive HTML can publish with posts.</text>
  <g transform="translate(120 230)">
    <line x1="0" y1="290" x2="900" y2="290" stroke="#64748b" stroke-width="3"/>
    <rect x="80" y="140" width="120" height="150" rx="18" fill="url(#bar)"/>
    <rect x="310" y="70" width="120" height="220" rx="18" fill="url(#bar)"/>
    <rect x="540" y="20" width="120" height="270" rx="18" fill="url(#bar)"/>
    <text x="60" y="340" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="24">Post JSON</text>
    <text x="302" y="340" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="24">R2 Assets</text>
    <text x="514" y="340" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="24">Interactive</text>
  </g>
  <text x="80" y="575" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22">Smoke asset for publish workflow verification</text>
</svg>
