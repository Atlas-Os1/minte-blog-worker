<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">MK and Tike Episode One production pipeline</title><desc id="d">A five-stage pipeline from story brief to HeyGen performance, generated coverage, edit and media QA.</desc><rect width="1200" height="430" rx="28" fill="#07131b"/><text x="60" y="62" fill="#f7f1e5" font-family="Arial" font-size="30" font-weight="700">MK &amp; Tike Episode One: production pipeline</text><g font-family="Arial"><g transform="translate(60 125)"><rect width="190" height="190" rx="18" fill="#123441" stroke="#78d6c6" stroke-width="3"/><text x="24" y="48" fill="#78d6c6" font-size="18">01</text><text x="24" y="91" fill="white" font-size="22" font-weight="700">Story brief</text><text x="24" y="130" fill="#c9d5d7" font-size="16">characters</text><text x="24" y="154" fill="#c9d5d7" font-size="16">beats + safety</text></g><path d="M260 220h55" stroke="#78d6c6" stroke-width="4"/><path d="m305 208 18 12-18 12" fill="none" stroke="#78d6c6" stroke-width="4"/><g transform="translate(335 125)"><rect width="190" height="190" rx="18" fill="#123441" stroke="#78d6c6" stroke-width="3"/><text x="24" y="48" fill="#78d6c6" font-size="18">02</text><text x="24" y="91" fill="white" font-size="22" font-weight="700">HeyGen</text><text x="24" y="130" fill="#c9d5d7" font-size="16">MK + Tike Looks</text><text x="24" y="154" fill="#c9d5d7" font-size="16">modular takes</text></g><path d="M535 220h55" stroke="#78d6c6" stroke-width="4"/><path d="m580 208 18 12-18 12" fill="none" stroke="#78d6c6" stroke-width="4"/><g transform="translate(610 125)"><rect width="190" height="190" rx="18" fill="#123441" stroke="#78d6c6" stroke-width="3"/><text x="24" y="48" fill="#78d6c6" font-size="18">03</text><text x="24" y="91" fill="white" font-size="22" font-weight="700">Coverage</text><text x="24" y="130" fill="#c9d5d7" font-size="16">Cloudflare shots</text><text x="24" y="154" fill="#c9d5d7" font-size="16">duck comedy + SFX</text></g><path d="M810 220h55" stroke="#78d6c6" stroke-width="4"/><path d="m855 208 18 12-18 12" fill="none" stroke="#78d6c6" stroke-width="4"/><g transform="translate(885 125)"><rect width="190" height="190" rx="18" fill="#123441" stroke="#78d6c6" stroke-width="3"/><text x="24" y="48" fill="#78d6c6" font-size="18">04</text><text x="24" y="91" fill="white" font-size="22" font-weight="700">Editorial</text><text x="24" y="130" fill="#c9d5d7" font-size="16">selects</text><text x="24" y="154" fill="#c9d5d7" font-size="16">continuity + pacing</text></g><text x="60" y="370" fill="#aebfc2" font-size="17">The file is not finished when it renders. It is finished when the story, identity, timing, audio, and delivery all survive review.</text></g></svg>