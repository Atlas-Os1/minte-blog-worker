<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="950" viewBox="0 0 1900 950"><rect width="1900" height="950" fill="#0e1018"/><text x="90" y="90" fill="#fff" font-family="Arial" font-size="42" font-weight="700">The content pipeline behind the tutorial</text><g font-family="Arial" text-anchor="middle"><g fill="#151b2a" stroke="#54d6b5" stroke-width="3"><rect x="80" y="260" width="250" height="145" rx="18"/><rect x="410" y="260" width="250" height="145" rx="18"/><rect x="740" y="260" width="250" height="145" rx="18"/><rect x="1070" y="260" width="250" height="145" rx="18"/><rect x="1400" y="260" width="330" height="145" rx="18"/></g><g fill="#fff" font-size="24"><text x="205" y="315">Brief</text><text x="205" y="350">roles + story</text><text x="535" y="315">Atlas-bro</text><text x="535" y="350">intake + routing</text><text x="865" y="315">Atlas-content</text><text x="865" y="350">OpenMontage render</text><text x="1195" y="315">Review</text><text x="1195" y="350">frames + format</text><text x="1565" y="315">R2 / minte.dev</text><text x="1565" y="350">public delivery</text></g></g><g stroke="#ff6a25" stroke-width="8"><path d="M335 332h65"/><path d="M665 332h65"/><path d="M995 332h65"/><path d="M1325 332h65"/></g><g fill="#ff6a25"><path d="M386 316l24 16-24 16z"/><path d="M716 316l24 16-24 16z"/><path d="M1046 316l24 16-24 16z"/><path d="M1376 316l24 16-24 16z"/></g><rect x="180" y="580" width="1540" height="110" rx="18" fill="#171d2c" stroke="#ff6a25" stroke-width="3"/><text x="950" y="645" fill="#ddd8e7" font-family="Arial" font-size="26" text-anchor="middle">The important handoff is not “AI made a video.” It is source brief → named roles → render → review → verified public artifact.</text></svg>